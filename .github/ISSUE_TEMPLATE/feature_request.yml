name: Feature request
description: Suggest a focused improvement to RunTiyul
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Large changes should begin in Discussions.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues, discussions, and the project wiki.
          required: true
        - label: This request does not include personal location data or credentials.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this, in what situation, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than only a technical solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds or smaller options.
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: I considered offline behavior and location privacy.
          required: true
        - label: I considered map-provider licensing if this affects maps or downloads.
          required: true
        - label: I understand RunTiyul is not an emergency or rescue service.
          required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the repository's Code of Conduct.
          required: true